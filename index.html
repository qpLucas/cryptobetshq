<!DOCTYPE html>
<html lang="en">
<head>
  <!-- hreflang: add alternate URLs when additional language versions go live -->
  <link rel="alternate" hreflang="en" href="https://cryptobetshq.vercel.app/">
  <link rel="alternate" hreflang="cs" href="https://cryptobetshq.vercel.app/cs/">
  <link rel="alternate" hreflang="x-default" href="https://cryptobetshq.vercel.app/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Bets HQ – Cloudbet Betting Picks & Casino Guide</title>
  <meta name="description" content="Daily crypto betting picks, casino game picks and Cloudbet guides. Your edge in sports and casino wagering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>

<div id="header-mount"></div>

<main>
  <div class="site-main">

        <!-- ── ARTICLES ── -->
    <section class="articles-section">
      <div class="section-header">
        <h2 class="section-title">Latest articles</h2>
      </div>

      <div class="articles-columns" id="articles-grid">
        <!-- Rendered by JS -->
      </div>
    </section>

  </div>
</main>

<div id="footer-mount"></div>


<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('header-mount').innerHTML = getHeaderHTML('');
  document.getElementById('footer-mount').innerHTML = getFooterHTML();
  renderArticles();
});

function renderArticles() {
  const articles = DB.get('articles') || [];
  const cats = [
    { key: 'casino', label: 'Casino', color: '#f0a500' },
    { key: 'sports', label: 'Sports', color: '#4ade80' },
    { key: 'affiliates', label: 'Affiliates', color: '#60a5fa' },
    { key: 'blog', label: 'Blog', color: '#a78bfa' },
  ];

  const grid = document.getElementById('articles-grid');
  grid.innerHTML = cats.map(cat => {
    const catArticles = articles.filter(a => a.cat === cat.key);
    const featured = catArticles[0];
    const smalls = catArticles.slice(1, 4);

    const featuredHTML = featured ? `
    <div class="article-featured" onclick="location.href='article.html?id=${featured.id}'">
      <div class="art-img"><img src="${featured.img}" alt="${featured.title}" loading="lazy"></div>
      <div class="art-body">
        <div class="art-cat" style="color:${cat.color}">${cat.label}</div>
        <div class="art-title">${featured.title}</div>
        <div class="art-meta">${featured.date}</div>
      </div>
    </div>` : '';

    const smallsHTML = smalls.map(a => `
    <div class="article-small" onclick="location.href='article.html?id=${a.id}'">
      <div class="art-small-img"><img src="${a.img}" alt="${a.title}" loading="lazy"></div>
      <div class="art-small-info">
        <div class="art-small-title">${a.title}</div>
        <div class="art-small-meta">${a.date}</div>
      </div>
    </div>`).join('');

    return `
    <div class="article-column">
      <div class="column-header">
        <div class="column-cat-dot" style="background:${cat.color}"></div>
        <span class="column-cat">${cat.label}</span>
      </div>
      ${featuredHTML}
      ${smallsHTML}
      <div style="margin-top:10px;">
        <a href="${cat.key === 'blog' ? 'blog.html' : cat.key + '.html'}" class="section-more" style="font-size:12px;">More ${cat.label} →</a>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
