<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Crypto Bets HQ</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js" defer></script>
</head>
<body class="admin-body">
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar-logo">
      <div class="header-logo">
        <div class="logo-mark" style="width:28px;height:28px;font-size:14px">CB</div>
        <span class="logo-text" style="font-size:15px">Crypto Bets <span>HQ</span> <span style="color:var(--text-dim);font-weight:400">Admin</span></span>
      </div>
    </div>

    <div class="admin-nav-section">Content</div>
    <a href="index.html" class="admin-nav-link active" id="nav-dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="tips.html" class="admin-nav-link" id="nav-tips">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Betting Tips
    </a>
    <a href="articles.html" class="admin-nav-link" id="nav-articles">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Articles
    </a>

    <div class="admin-nav-section" style="margin-top:8px">Site</div>
    <a href="../index.html" class="admin-nav-link" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      View site
    </a>
  </aside>

  <!-- Content -->
  <div class="admin-content">
    <div class="admin-page-title">Dashboard</div>

    <!-- Stats row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;" id="stats-row"></div>

    <!-- Recent tips preview -->
    <div class="admin-card">
      <h3>Recent tips <span style="float:right"><a href="tips.html" style="color:var(--gold);font-size:13px;font-weight:500">Manage →</a></span></h3>
      <div class="admin-table-wrap"><table class="admin-table" id="dash-tips"></table></div>
    </div>

    <!-- Recent articles preview -->
    <div class="admin-card">
      <h3>Recent articles <span style="float:right"><a href="articles.html" style="color:var(--gold);font-size:13px;font-weight:500">Manage →</a></span></h3>
      <div class="admin-table-wrap"><table class="admin-table" id="dash-articles"></table></div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const tips = DB.get('tips') || [];
  const articles = DB.get('articles') || [];

  // Stats
  const sports = [...new Set(tips.map(t=>t.sport))];
  document.getElementById('stats-row').innerHTML = [
    { label: 'Total tips', val: tips.length, color: '#f0a500' },
    { label: 'Total articles', val: articles.length, color: '#60a5fa' },
    { label: 'Sports covered', val: sports.length, color: '#4ade80' },
    { label: 'Last updated', val: 'Today', color: '#a78bfa' },
  ].map(s => `
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">${s.label}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:700;color:${s.color}">${s.val}</div>
    </div>`).join('');

  // Tips table
  document.getElementById('dash-tips').innerHTML = `
    <thead><tr><th>Teams</th><th>Sport</th><th>Pick</th><th>Odds</th><th>Date</th></tr></thead>
    <tbody>${tips.slice(0,5).map(t => `
      <tr>
        <td style="color:var(--text-pri);font-weight:500">${t.home} vs ${t.away}</td>
        <td><span class="badge badge-blue">${t.sport}</span></td>
        <td>${t.pick}</td>
        <td style="color:var(--accent);font-weight:600">${t.odds}</td>
        <td>${t.date} ${t.time}</td>
      </tr>`).join('')}
    </tbody>`;

  // Articles table
  document.getElementById('dash-articles').innerHTML = `
    <thead><tr><th>Title</th><th>Category</th><th>Date</th></tr></thead>
    <tbody>${articles.slice(0,5).map(a => `
      <tr>
        <td style="color:var(--text-pri)">${a.title.slice(0,60)}${a.title.length>60?'…':''}</td>
        <td><span class="badge badge-amber">${a.cat}</span></td>
        <td>${a.date}</td>
      </tr>`).join('')}
    </tbody>`;
});
</script>
</body>
</html>
