<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin – WeWinCrypto.com</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap">
  <aside class="admin-side">
    <div class="admin-logo"><img src="../logo-mobile.png" alt="CBHQ Admin"></div>
    <div class="admin-sec-label">Content</div>
    <a href="/admin/index.html" class="admin-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="/admin/articles.html" class="admin-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Articles
    </a>
    <a href="/admin/review.html" class="admin-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      Review
    </a>
    <div class="admin-sec-label">Site</div>
    <a href="../"" class="admin-link" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      View site
    </a>
  </aside>
  <div class="admin-content">
    <div class="admin-title">Dashboard</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px" id="stats"></div>
    <div class="admin-card">
      <h3>Recent articles <span style="float:right"><a href="/admin/articles.html" style="font-size:13px;font-weight:500">Manage →</a></span></h3>
      <div style="overflow-x:auto"><table class="tbl" id="dash-table"></table></div>
    </div>
  </div>
</div>
<script src="../app.js"></script>
<script>
var arts = DB.get('articles') || [];
document.getElementById('stats').innerHTML = [
  ['Total articles', arts.length, 'var(--accent)'],
  ['Categories', 4, 'var(--cta)'],
  ['Last updated', 'Today', '#a78bfa'],
].map(function(s) {
  return '<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px">'
    + '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">' + s[0] + '</div>'
    + '<div style="font-family:\'Outfit\',sans-serif;font-size:28px;font-weight:700;color:' + s[2] + '">' + s[1] + '</div>'
    + '</div>';
}).join('');

document.getElementById('dash-table').innerHTML = '<thead><tr><th>Title</th><th>Category</th><th>Date</th></tr></thead>'
  + '<tbody>' + arts.slice(0,6).map(function(a) {
    return '<tr><td style="color:var(--text)">' + a.title.slice(0,55) + (a.title.length>55?'…':'') + '</td>'
      + '<td><span class="badge badge-amber">' + a.cat + '</span></td>'
      + '<td>' + a.date + '</td></tr>';
  }).join('') + '</tbody>';
</script>
</body>
</html>
