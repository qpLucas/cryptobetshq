<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Articles – Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js" defer></script>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-logo">
      <div class="header-logo">
        <div class="logo-mark" style="width:28px;height:28px;font-size:14px">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 2L13 7H18L14 11L16 17L10 13.5L4 17L6 11L2 7H7L10 2Z" fill="#0e0e14" stroke="#0e0e14" stroke-width="0.5" stroke-linejoin="round"/></svg>
        </div>
        <span class="logo-text" style="font-size:15px">Crypto Bets <span>HQ</span> <span style="color:var(--text-dim);font-weight:400">Admin</span></span>
      </div>
    </div>
    <div class="admin-nav-section">Content</div>
    <a href="index.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="tips.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Betting Tips
    </a>
    <a href="articles.html" class="admin-nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Articles
    </a>
    <div class="admin-nav-section" style="margin-top:8px">Site</div>
    <a href="../index.html" class="admin-nav-link" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      View site
    </a>
  </aside>

  <div class="admin-content">
    <div class="admin-page-title">Articles</div>

    <div class="admin-card">
      <h3 id="form-title">Add new article</h3>
      <input type="hidden" id="edit-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="art-cat">
            <option value="casino">Casino</option>
            <option value="sports">Sports</option>
            <option value="affiliates">Affiliates</option>
            <option value="blog">Blog</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Publish date (e.g. 2 Jun 2026)</label>
          <input type="text" class="form-input" id="art-date" placeholder="2 Jun 2026">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="art-title" placeholder="Article headline">
      </div>
      <div class="form-group">
        <label class="form-label">Summary / Excerpt</label>
        <textarea class="form-textarea" id="art-summary" placeholder="Short intro shown on listing pages..." style="min-height:70px"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Full body content</label>
        <textarea class="form-textarea" id="art-body" placeholder="Full article content (supports basic HTML like &lt;p&gt;, &lt;h2&gt;, &lt;strong&gt;)..." style="min-height:160px"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Cover image URL</label>
        <input type="text" class="form-input" id="art-img" placeholder="https://images.unsplash.com/...">
        <div style="margin-top:6px;font-size:11px;color:var(--text-dim)">Tip: use <a href="https://unsplash.com" target="_blank" style="color:var(--accent)">Unsplash</a> or any image URL ending in ?w=800</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-gold" onclick="saveArticle()" style="padding:11px 22px">Save article</button>
        <button class="btn-outline" onclick="resetForm()" style="padding:10px 18px">Clear</button>
      </div>
      <div id="form-msg" style="margin-top:10px;font-size:13px;display:none"></div>
    </div>

    <div class="admin-card">
      <h3>All articles (<span id="art-count">0</span>)</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px" id="cat-filters">
        <button onclick="filterCat('all')" class="btn-gold" id="fc-all" style="font-size:11px;padding:5px 12px">All</button>
        <button onclick="filterCat('casino')" class="btn-outline" id="fc-casino" style="font-size:11px;padding:5px 12px">Casino</button>
        <button onclick="filterCat('sports')" class="btn-outline" id="fc-sports" style="font-size:11px;padding:5px 12px">Sports</button>
        <button onclick="filterCat('affiliates')" class="btn-outline" id="fc-affiliates" style="font-size:11px;padding:5px 12px">Affiliates</button>
        <button onclick="filterCat('blog')" class="btn-outline" id="fc-blog" style="font-size:11px;padding:5px 12px">Blog</button>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="articles-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let currentCat = 'all';
document.addEventListener('DOMContentLoaded', () => renderTable('all'));

function renderTable(cat) {
  const all = DB.get('articles') || [];
  const articles = cat === 'all' ? all : all.filter(a => a.cat === cat);
  document.getElementById('art-count').textContent = all.length;
  const catColors = { casino:'badge-amber', sports:'badge-green', affiliates:'badge-blue', blog:'badge-blue' };
  document.getElementById('articles-tbody').innerHTML = articles.map(a => `
    <tr>
      <td style="color:var(--text-pri);max-width:320px">
        <div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px">${a.title}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px">${a.summary||''}</div>
      </td>
      <td><span class="badge ${catColors[a.cat]||'badge-blue'}">${a.cat}</span></td>
      <td style="white-space:nowrap">${a.date}</td>
      <td style="white-space:nowrap">
        <button class="action-btn edit" onclick="editArticle(${a.id})">Edit</button>
        <button class="action-btn del" onclick="deleteArticle(${a.id})" style="margin-left:4px">Delete</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-dim);padding:20px">No articles yet</td></tr>';
}

function filterCat(cat) {
  currentCat = cat;
  document.querySelectorAll('#cat-filters button').forEach(b => {
    b.className = b.id === 'fc-' + cat ? 'btn-gold' : 'btn-outline';
    b.style.cssText = 'font-size:11px;padding:5px 12px';
  });
  renderTable(cat);
}

function saveArticle() {
  const title = document.getElementById('art-title').value.trim();
  const summary = document.getElementById('art-summary').value.trim();
  const body = document.getElementById('art-body').value.trim();
  const img = document.getElementById('art-img').value.trim();
  const cat = document.getElementById('art-cat').value;
  const date = document.getElementById('art-date').value.trim() || new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  if (!title) { showMsg('Title is required.','error'); return; }

  const editId = parseInt(document.getElementById('edit-id').value);
  if (editId) {
    const articles = DB.get('articles') || [];
    const idx = articles.findIndex(a => a.id === editId);
    if (idx !== -1) { articles[idx] = { ...articles[idx], title, summary, body, img, cat, date }; DB.set('articles', articles); }
  } else {
    DB.push('articles', { title, summary, body, img, cat, date });
  }
  showMsg('Article saved!','success');
  resetForm();
  renderTable(currentCat);
}

function editArticle(id) {
  const art = (DB.get('articles')||[]).find(a => a.id === id);
  if (!art) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('form-title').textContent = 'Edit article';
  document.getElementById('art-cat').value = art.cat;
  document.getElementById('art-date').value = art.date;
  document.getElementById('art-title').value = art.title;
  document.getElementById('art-summary').value = art.summary||'';
  document.getElementById('art-body').value = art.body||'';
  document.getElementById('art-img').value = art.img||'';
  window.scrollTo({top:0,behavior:'smooth'});
}

function deleteArticle(id) {
  if (!confirm('Delete this article?')) return;
  DB.del('articles', id);
  renderTable(currentCat);
}

function resetForm() {
  ['edit-id','art-title','art-summary','art-body','art-img','art-date'].forEach(id => document.getElementById(id).value='');
  document.getElementById('art-cat').value='casino';
  document.getElementById('form-title').textContent='Add new article';
}

function showMsg(text,type) {
  const el = document.getElementById('form-msg');
  el.textContent = text; el.style.display='block';
  el.style.color = type==='success' ? '#34d399' : '#f87171';
  setTimeout(()=>{ el.style.display='none'; },3000);
}
</script>
</body>
</html>
