<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Tips – Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/app.js" defer></script>
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-logo">
      <div class="header-logo">
        <div class="logo-mark" style="width:28px;height:28px;font-size:14px">CB</div>
        <span class="logo-text" style="font-size:15px">Crypto Bets <span>HQ</span> <span style="color:var(--text-dim);font-weight:400">Admin</span></span>
      </div>
    </div>
    <div class="admin-nav-section">Content</div>
    <a href="index.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="tips.html" class="admin-nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Betting Tips
    </a>
    <a href="articles.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Articles
    </a>
    <div class="admin-nav-section" style="margin-top:8px">Site</div>
    <a href="../index.html" class="admin-nav-link" target="_blank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      View site
    </a>
  </aside>

  <div class="admin-content">
    <div class="admin-page-title">Betting Tips</div>

    <!-- Add tip form -->
    <div class="admin-card">
      <h3 id="form-title">Add new tip</h3>
      <input type="hidden" id="edit-id">
      <div class="form-row-3">
        <div class="form-group">
          <label class="form-label">Sport</label>
          <select class="form-select" id="tip-sport">
            <option value="football">Football</option>
            <option value="esports">Esports</option>
            <option value="basketball">Basketball</option>
            <option value="tennis">Tennis</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Match time (e.g. 20:45)</label>
          <input type="text" class="form-input" id="tip-time" placeholder="20:45">
        </div>
        <div class="form-group">
          <label class="form-label">Date label (e.g. Today)</label>
          <input type="text" class="form-input" id="tip-date" placeholder="Today">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Home team / Player 1</label>
          <input type="text" class="form-input" id="tip-home" placeholder="e.g. Real Madrid">
        </div>
        <div class="form-group">
          <label class="form-label">Away team / Player 2</label>
          <input type="text" class="form-input" id="tip-away" placeholder="e.g. Man City">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Our pick</label>
          <input type="text" class="form-input" id="tip-pick" placeholder="e.g. Real Madrid Win">
        </div>
        <div class="form-group">
          <label class="form-label">Best odds</label>
          <input type="text" class="form-input" id="tip-odds" placeholder="e.g. 2.15">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confidence (1–5)</label>
        <div style="display:flex;align-items:center;gap:12px">
          <input type="range" min="1" max="5" value="3" id="tip-conf" style="width:160px" oninput="document.getElementById('conf-val').textContent=this.value">
          <span id="conf-val" style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--accent)">3</span>
          <span style="font-size:12px;color:var(--text-dim)">out of 5</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Analysis / Reasoning</label>
        <textarea class="form-textarea" id="tip-analysis" placeholder="Explain your reasoning for this pick..."></textarea>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn-gold" onclick="saveTip()" style="padding:11px 22px">Save tip</button>
        <button class="btn-outline" onclick="resetForm()" style="padding:10px 18px">Clear</button>
      </div>
      <div id="form-msg" style="margin-top:10px;font-size:13px;display:none"></div>
    </div>

    <!-- Tips table -->
    <div class="admin-card">
      <h3>All tips (<span id="tip-count">0</span>)</h3>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead><tr><th>Teams</th><th>Sport</th><th>Pick</th><th>Odds</th><th>Time</th><th>Conf.</th><th>Actions</th></tr></thead>
          <tbody id="tips-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', renderTable);

function renderTable() {
  const tips = DB.get('tips') || [];
  document.getElementById('tip-count').textContent = tips.length;
  const sportBadge = { football:'badge-green', esports:'badge-blue', basketball:'badge-amber', tennis:'badge-amber', other:'badge-blue' };
  document.getElementById('tips-tbody').innerHTML = tips.map(t => `
    <tr>
      <td style="color:var(--text-pri);font-weight:500;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.home} vs ${t.away}</td>
      <td><span class="badge ${sportBadge[t.sport]||'badge-blue'}">${t.sport}</span></td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.pick}</td>
      <td style="color:var(--accent);font-weight:600">${t.odds}</td>
      <td>${t.date} ${t.time}</td>
      <td>${'★'.repeat(t.conf)}</td>
      <td style="white-space:nowrap">
        <button class="action-btn edit" onclick="editTip(${t.id})">Edit</button>
        <button class="action-btn del" onclick="deleteTip(${t.id})" style="margin-left:4px">Delete</button>
      </td>
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-dim);padding:20px">No tips yet</td></tr>';
}

function saveTip() {
  const fields = { sport:'tip-sport', time:'tip-time', date:'tip-date', home:'tip-home', away:'tip-away', pick:'tip-pick', odds:'tip-odds', analysis:'tip-analysis' };
  const tip = {};
  for (const [k,id] of Object.entries(fields)) tip[k] = document.getElementById(id).value.trim();
  tip.conf = parseInt(document.getElementById('tip-conf').value);
  if (!tip.home || !tip.away || !tip.pick || !tip.odds) { showMsg('Please fill in all required fields.', 'error'); return; }

  const editId = parseInt(document.getElementById('edit-id').value);
  if (editId) {
    const tips = DB.get('tips') || [];
    const idx = tips.findIndex(t => t.id === editId);
    if (idx !== -1) { tips[idx] = { ...tips[idx], ...tip }; DB.set('tips', tips); }
  } else {
    DB.push('tips', tip);
  }
  showMsg('Tip saved successfully!', 'success');
  resetForm();
  renderTable();
}

function editTip(id) {
  const tip = (DB.get('tips') || []).find(t => t.id === id);
  if (!tip) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('form-title').textContent = 'Edit tip';
  document.getElementById('tip-sport').value = tip.sport;
  document.getElementById('tip-time').value = tip.time;
  document.getElementById('tip-date').value = tip.date;
  document.getElementById('tip-home').value = tip.home;
  document.getElementById('tip-away').value = tip.away;
  document.getElementById('tip-pick').value = tip.pick;
  document.getElementById('tip-odds').value = tip.odds;
  document.getElementById('tip-conf').value = tip.conf;
  document.getElementById('conf-val').textContent = tip.conf;
  document.getElementById('tip-analysis').value = tip.analysis || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deleteTip(id) {
  if (!confirm('Delete this tip?')) return;
  DB.del('tips', id);
  renderTable();
}

function resetForm() {
  ['edit-id','tip-time','tip-date','tip-home','tip-away','tip-pick','tip-odds','tip-analysis'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('tip-sport').value = 'football';
  document.getElementById('tip-conf').value = 3;
  document.getElementById('conf-val').textContent = 3;
  document.getElementById('form-title').textContent = 'Add new tip';
}

function showMsg(text, type) {
  const el = document.getElementById('form-msg');
  el.textContent = text;
  el.style.display = 'block';
  el.style.color = type === 'success' ? '#34d399' : '#f87171';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}
</script>
</body>
</html>
